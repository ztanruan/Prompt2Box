[project]
name = "prompt2box"
version = "0.1.0"
description = "Gemini object detection in one import — labeled bounding boxes from a local image"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jin Tan Ruan" }]
keywords = ["gemini", "object-detection", "bounding-box", "computer-vision", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Floors reflect the APIs we actually use and test against (developed on
# google-genai 2.9, Pillow 11). google-genai pinned to the 2.x line because we
# rely on its typed errors (errors.APIError.code) and Part/Client/types surface;
# Pillow >= 10.1 for ImageFont.load_default(size=...).
dependencies = [
    "google-genai>=2.0.0",
    "pillow>=10.1.0",
    "pydantic>=2.0",  # used directly for the response_schema model (also a google-genai dep)
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.8"]
heic = ["pillow-heif>=0.13"]

[project.urls]
Homepage = "https://github.com/ztanruan/Prompt2Box"
Repository = "https://github.com/ztanruan/Prompt2Box"
Issues = "https://github.com/ztanruan/Prompt2Box/issues"

[project.scripts]
prompt2box = "prompt2box.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt2box"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear, comprehensions
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length handled by formatter; long strings are intentional

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # google.genai / PIL ship partial or no stubs
warn_unused_ignores = true
files = ["prompt2box"]
